[package]
name = "protect-suite"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "protect_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
once_cell = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.21"
url = "2"
regex = "1"
image = "0.25"
rxing = "0.7"
kamadak-exif = "0.6"
rdev = "0.5"
enigo = "0.3"
open = "5"

[profile.release]
strip = true
